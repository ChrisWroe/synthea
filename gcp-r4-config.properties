# Configuration for GCP Healthcare Cloud FHIR R4 Import
# This file configures Synthea to generate FHIR R4 data suitable for GCP Healthcare API

# Enable FHIR R4 export
exporter.fhir.export = true

# Enable bulk FHIR (ndjson) format - recommended for GCP imports
exporter.fhir.bulk_data = true

# Disable other export formats to keep output clean
exporter.ccda.export = false
exporter.csv.export = false
exporter.cpcds.export = false
exporter.text.export = false
exporter.clinical_note.export = false

# Optional: Use US Core profiles (compatible with R4)
exporter.fhir.use_us_core_ig = true

# Optional: Customize output directory
# exporter.baseDirectory = ./output_gcp/

# FHIR version is R4 by default, but you can verify with:
# exporter.fhir.transaction_bundle = true
